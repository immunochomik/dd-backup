[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dd-backup"
version = "0.1.0"
description = "Versioned backups of Datadog dashboards and referenced powerpacks"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "dd-backup contributors"}]
dependencies = []

[project.scripts]
dd-backup = "dd_backup.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

